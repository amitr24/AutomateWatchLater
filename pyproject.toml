[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automate-watch-later"
version = "0.3.0"
description = "Explainable, local-first prioritization for a YouTube learning backlog"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "selenium>=4.18,<5",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
watchlater = "watchlater.cli:main"

[tool.setuptools.package-data]
watchlater = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
